version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vouch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch_pass
      POSTGRES_DB: vouch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: vouch_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
